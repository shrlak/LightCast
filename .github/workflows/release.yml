# Builds the macOS (.dmg/.zip) and Windows (.exe) installers in the cloud and publishes them to the
# GitHub Release for the version in package.json. Installed copies of LightCast check these releases
# and update themselves.
#
# It runs by itself when a push to main changes the version in package.json (i.e. when a release PR is
# merged), and can still be run by hand (Actions → Release → Run workflow). It does NOT run on tag pushes:
# a release published from locally tested builds must not be overwritten by a second, untested cloud build,
# so an automatic run skips a version whose release already exists.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A manual run is on a branch, not a tag, and GitHub refuses a release without one
  # ("Published releases must have a valid tag"): make v<version> first, if it is not there yet.
  # The release itself is made here too: when the builds find none, each upload creates its own and the
  # installers end up split over several releases of one tag.
  tag:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the version tag and the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          # An automatic run (a push that touched package.json without bumping the version) must not
          # rebuild a version that is already released; a manual run always builds.
          if [ "${{ github.event_name }}" = push ] && gh release view "$v" >/dev/null 2>&1; then
            echo "release $v already exists; nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null 2>&1; then
            echo "$v already exists"
          else
            git tag "$v"
            git push origin "$v"
          fi
          if gh release view "$v" >/dev/null 2>&1; then
            echo "release $v already exists"
          else
            gh release create "$v" --verify-tag --title "${v#v}" --notes "LightCast ${v#v}"
          fi

  build:
    needs: tag
    if: needs.tag.outputs.build == 'true'
    strategy:
      # One platform failing must not cancel the others.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The installers carry the PowerPoint engine built from this commit's Rust source (engine/).
      - name: Build the Rust engine (WebAssembly)
        shell: bash
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup target add wasm32-unknown-unknown
          npm run engine
      - run: npm test
      - run: npm run build
      # electron-builder only builds here: its own GitHub publisher races itself (several uploads each try to
      # create the release; "already_exists" 422) and left v0.2.9 without latest-mac.yml. The files are
      # uploaded with `gh` instead, to the release the tag job made.
      - name: Package
        # Architectures come from package.json: one universal .dmg (Apple Silicon + Intel) and one
        # Windows installer holding x64 and ARM64; the per-architecture Mac .zip files are only for the updater.
        run: npx electron-builder ${{ matrix.os == 'macos-latest' && '--mac' || '--win' }} --publish never
      # An app bundle without a signature (not even ad-hoc) is refused by macOS as "damaged and can't be
      # opened" once downloaded, with no way to open it from Finder. Every Mac build must be sealed.
      - name: Check the Mac apps are signed
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          found=0
          for app in release/mac*/LightCast.app; do
            found=1
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | tee /dev/stderr | grep -Eq 'Signature=adhoc|Authority='
          done
          [ "$found" = 1 ] || { echo "::error::no LightCast.app was built"; exit 1; }
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="$(node -p "require('./package.json').version")"
          update="${{ matrix.os == 'macos-latest' && 'latest-mac.yml' || 'latest.yml' }}"
          [ -f "release/$update" ] || { echo "::error::release/$update was not built"; exit 1; }
          # Asset names as electron-builder's own publisher gave them and as latest*.yml refer to them:
          # spaces become hyphens ("LightCast Setup 1.2.3.exe" -> "LightCast-Setup-1.2.3.exe"); `gh` would turn them into dots.
          mkdir upload
          find release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) | while IFS= read -r f; do
            cp "$f" "upload/$(basename "$f" | tr ' ' '-')"
          done
          gh release upload "v$v" upload/* --clobber

  # Linux builds are extra: they never hold back the Mac and Windows installers (or the verify job below).
  # AppImage updates itself from latest-linux.yml; the .deb, .rpm and .tar.gz are installed by hand.
  # FreeBSD has no Electron build of its own: it runs the Linux .tar.gz through the Linuxulator
  # (see docs/linux-freebsd.md), or serves the web app with `npm start`.
  build-linux:
    needs: tag
    if: needs.tag.outputs.build == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - name: Build the Rust engine (WebAssembly)
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup target add wasm32-unknown-unknown
          npm run engine
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --linux --publish never
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="$(node -p "require('./package.json').version")"
          [ -f release/latest-linux.yml ] || { echo "::error::release/latest-linux.yml was not built"; exit 1; }
          mkdir upload
          find release -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name 'latest-linux.yml' \) | while IFS= read -r f; do
            cp "$f" "upload/$(basename "$f" | tr ' ' '-')"
          done
          gh release upload "v$v" upload/* --clobber

  # Every release carries both installers (one universal Mac .dmg, one Windows .exe for x64 and ARM64)
  # and the files the auto-updater reads (the per-architecture Mac .zip files and latest*.yml); fail
  # loudly if one is missing.
  verify:
    needs: [tag, build]
    if: needs.tag.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the release has both installers and the update files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="$(node -p "require('./package.json').version")"
          assets="$(gh release view "v$v" --json assets --jq '.assets[].name')"
          echo "$assets"
          missing=0
          for f in "LightCast-$v.dmg" "LightCast-Setup-$v.exe" "LightCast-$v-arm64-mac.zip" "LightCast-$v-mac.zip" latest.yml latest-mac.yml; do
            echo "$assets" | grep -qxF "$f" || { echo "::error::Release v$v is missing $f"; missing=1; }
          done
          exit $missing
