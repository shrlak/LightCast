# Removes each finished 주일예배 (everything in its folder except the library songs) from the church
# server at 5 pm Korean time on the day, whether or not LightCast is open anywhere. The app does the same
# while it is open; this job covers the times it is closed. Needs two repository secrets (Settings →
# Secrets and variables → Actions): LIGHTCAST_CLOUD_USER and LIGHTCAST_CLOUD_PASSWORD, the church account.
# Without them the job does nothing.
name: Service cleanup

on:
  schedule:
    # Sunday 17:07 KST until Monday 08:07 KST, hourly, and Monday morning as a catch-up (cron is UTC).
    - cron: '7 8-23 * * 0'
    - cron: '7 0-8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      LIGHTCAST_CLOUD_USER: ${{ secrets.LIGHTCAST_CLOUD_USER }}
      LIGHTCAST_CLOUD_PASSWORD: ${{ secrets.LIGHTCAST_CLOUD_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/cloud-cleanup.mjs
