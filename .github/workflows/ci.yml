name: Remote and build verification

on:
  push:
    branches: [main, fix/remote-keepalive-reconnect-status]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The PowerPoint engine is Rust (engine/): test it, then rebuild the WebAssembly module the app
      # loads, so the JavaScript tests below run against the engine built from this commit's source.
      - name: Rust engine tests
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup target add wasm32-unknown-unknown
          cargo test --manifest-path engine/Cargo.toml -p freecast-engine
      - run: npm run engine
      - run: npm test
      - run: npm run build

  # The iPhone app (ios/) is Swift and cannot be built on Linux: compile it for the simulator on a Mac.
  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Build the iPhone app
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project LightCastRemote.xcodeproj -scheme LightCastRemote -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
